name: Render Quarto PDF Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # 2b. Cache R packages (MAJOR SPEED-UP)
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/R
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            r-${{ runner.os }}-

      # 3. Set up Quarto (PINNED, STABLE)
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.4.553"

      # 3b. Cache TinyTeX.
      # Quarto installs TinyTeX into the XDG data dir on Linux
      # (~/.local/share/TinyTeX), NOT ~/.TinyTeX. The original key cached a
      # path that never existed, so TinyTeX was silently reinstalled on every
      # single run. Both locations are listed so a hit works either way.
      # Bump -v3 to -v4 (etc.) to force a fresh TeX Live.
      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/.local/share/TinyTeX
          key: tinytex-${{ runner.os }}-v3

      # 3c. Install TinyTeX safely (skips if cached)
      - name: Install TinyTeX
        run: |
          quarto install tinytex

      # 3d. Make sure the LaTeX packages this report needs are present.
      # tlmgr is LOCATED rather than assumed -- hardcoding a bin path is what
      # broke run #56. This step can never fail the build: if tlmgr cannot be
      # found, TinyTeX's mid-render auto-install remains the fallback and the
      # render step reports the real error instead of this one masking it.
      - name: Install required LaTeX packages
        continue-on-error: true
        run: |
          set +e
          TLMGR="$(command -v tlmgr)"
          if [ -z "$TLMGR" ]; then
            for d in "$HOME"/.TinyTeX/bin/* "$HOME"/.local/share/TinyTeX/bin/*; do
              if [ -x "$d/tlmgr" ]; then TLMGR="$d/tlmgr"; break; fi
            done
          fi
          echo "tlmgr resolved to: ${TLMGR:-<not found>}"
          if [ -n "$TLMGR" ]; then
            "$TLMGR" update --self
            "$TLMGR" install \
              tabularx enumitem booktabs colortbl xcolor caption \
              titlesec multicol fancyhdr lastpage float setspace
          fi
          exit 0

      # 4. System dependencies (graphics, fonts, PDF)
      - name: Install system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libuv1-dev \
            libharfbuzz-dev \
            libfreetype6-dev \
            fonts-dejavu \
            fonts-liberation

      # 5. Install required R packages (cache-aware)
      - name: Install R packages
        run: |
          Rscript -e '
          pkgs <- c(
            "knitr","rmarkdown","dplyr","ggplot2","readr","tidyr",
            "purrr","stringr","forcats","googlesheets4","gargle",
            "jsonlite","xml2","systemfonts","ragg","svglite",
            "curl","httr2","ggthemes","openxlsx"
          )
          new <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(new)) install.packages(new, repos = "https://cloud.r-project.org")
          '

      # 6. Write Google Sheets service account to file
      - name: Write Google Sheets service account to file
        run: |
          echo "${{ secrets.GSHEET_SERVICE_ACCOUNT }}" | base64 --decode > gsheets.json

      # 7. Render the Quarto PDF
      - name: Render PDF
        run: |
          quarto render quarterly_macro_debt_report_ieakenya.qmd --to pdf

      # 7b. On failure, print the LaTeX log so the real error is visible in
      # the Actions UI instead of only "Process completed with exit code 1".
      - name: Show LaTeX log on failure
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            echo "===== $f (last 150 lines) ====="
            tail -150 "$f"
          done

      # 8. Move output PDF to docs/
      - name: Move PDF to docs
        run: |
          mkdir -p docs
          mv quarterly_macro_debt_report_ieakenya.pdf docs/

      # 8.5 Stash local changes (required before rebase)
      - name: Stash changes
        run: |
          git stash --include-untracked

      # 8.6 Pull latest main to avoid CI push conflicts
      - name: Pull latest main
        run: |
          git pull --rebase origin main

      # 8.7 Restore stashed changes
      - name: Apply stashed changes
        run: |
          git stash pop || echo "Nothing to pop"

      # 9. Commit PDF (and the Figure 1 Excel data export) back to main
      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/quarterly_macro_debt_report_ieakenya.pdf docs/figure1_debt_trend_data.xlsx docs/figure2_debt_per_capita_data.xlsx docs/figure3_debt_to_gdp_data.xlsx
          git commit -m "Update latest quarterly debt report PDF and Figure 1 data export" || echo "No changes to commit"
          git push