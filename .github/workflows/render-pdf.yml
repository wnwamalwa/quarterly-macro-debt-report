name: Render Quarto PDF Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Every day at 05:17 Nairobi time (02:17 UTC), so the "As at" figures are
    # today's. The report covers the last COMPLETED quarter, so a new edition
    # (Q4 2026, Q1 2027 ...) starts automatically on 1 Jan/Apr/Jul/Oct.
    - cron: '17 2 * * *'

concurrency:
  group: render-report
  cancel-in-progress: false

jobs:
  render-pdf:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      # use-public-rspm installs from Posit's public Package Manager, which
      # serves pre-built binaries matched to the runner's Ubuntu version
      # instead of compiling every package from CRAN source. This is the
      # official r-lib fix for CRAN-source installs that intermittently
      # fail or hang on a single package deep in a long dependency chain
      # (seen twice in a row here on kableExtra) -- binaries also install
      # far faster since nothing needs compiling.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 2b. Cache R packages (MAJOR SPEED-UP)
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/R
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            r-${{ runner.os }}-

      # 3. Set up Quarto (PINNED, STABLE)
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.4.553"

      # 3b. Cache TinyTeX.
      # Quarto installs TinyTeX into the XDG data dir on Linux
      # (~/.local/share/TinyTeX), NOT ~/.TinyTeX. The original key cached a
      # path that never existed, so TinyTeX was silently reinstalled on every
      # single run. Both locations are listed so a hit works either way.
      # Bump -v3 to -v4 (etc.) to force a fresh TeX Live.
      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/.local/share/TinyTeX
          key: tinytex-${{ runner.os }}-v4

      # 3c. Install TinyTeX safely (skips if cached)
      - name: Install TinyTeX
        run: |
          quarto install tinytex

      # 3d. Make sure the LaTeX packages this report needs are present.
      # tlmgr is LOCATED rather than assumed -- hardcoding a bin path is what
      # broke run #56. This step can never fail the build: if tlmgr cannot be
      # found, TinyTeX's mid-render auto-install remains the fallback and the
      # render step reports the real error instead of this one masking it.
      - name: Install required LaTeX packages
        continue-on-error: true
        run: |
          set +e
          TLMGR="$(command -v tlmgr)"
          if [ -z "$TLMGR" ]; then
            for d in "$HOME"/.TinyTeX/bin/* "$HOME"/.local/share/TinyTeX/bin/*; do
              if [ -x "$d/tlmgr" ]; then TLMGR="$d/tlmgr"; break; fi
            done
          fi
          echo "tlmgr resolved to: ${TLMGR:-<not found>}"
          if [ -n "$TLMGR" ]; then
            "$TLMGR" update --self
            "$TLMGR" install \
              tabularx enumitem booktabs colortbl xcolor caption \
              titlesec multicol fancyhdr lastpage float setspace \
              xltabular ltablex
          fi
          exit 0

      # 4. System dependencies (graphics, fonts, PDF)
      - name: Install system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libuv1-dev \
            libharfbuzz-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libpng-dev \
            fonts-dejavu \
            fonts-liberation

      # 5. Install required R packages (cache-aware)
      - name: Install R packages
        run: |
          Rscript -e '
          pkgs <- c(
            "knitr","rmarkdown","dplyr","ggplot2","readr","tidyr",
            "purrr","stringr","forcats","googlesheets4","gargle",
            "jsonlite","xml2","systemfonts","ragg","svglite",
            "curl","httr2","ggthemes","openxlsx",
            # kableExtra/scales/tibble are loaded by the report but were
            # absent here: this list was written for the earlier placeholder
            # document, which did not use them. Their absence is what made
            # every render fail with "there is no package called kableExtra".
            "kableExtra","scales","tibble"
          )
          new <- pkgs[!pkgs %in% rownames(installed.packages())]
          # No explicit repos= here: use-public-rspm (setup-r step above) has
          # already pointed getOption("repos") at Posit'"'"'s public binary
          # mirror. Hardcoding cloud.r-project.org here (the old code) forced
          # every install back onto CRAN source tarballs, silently defeating
          # that setting -- which is why textshaping/ragg/svglite/kableExtra
          # kept failing to compile despite use-public-rspm: true being on.
          if (length(new)) install.packages(new)

          # Verify every package the .qmd loads is actually installed, and
          # stop here with a clear message if not. Without this the failure
          # surfaces 10 minutes later as an opaque library() error.
          src <- readLines("quarterly_macro_debt_report_ieakenya.qmd", warn = FALSE)
          used <- unique(c(
            gsub(".*library\\(([A-Za-z0-9._]+)\\).*", "\\1",
                 grep("library\\(", src, value = TRUE)),
            gsub(".*requireNamespace\\(\"([A-Za-z0-9._]+)\".*", "\\1",
                 grep("requireNamespace\\(", src, value = TRUE))
          ))
          used <- used[grepl("^[A-Za-z][A-Za-z0-9._]*$", used)]
          absent <- used[!used %in% rownames(installed.packages())]
          if (length(absent)) {
            stop("The report loads packages this workflow does not install: ",
                 paste(absent, collapse = ", "),
                 ". Add them to the pkgs vector above.")
          }
          cat("All", length(used), "packages required by the report are installed.\n")
          '

      # 6. Write Google Sheets service account to file
      - name: Write Google Sheets service account to file
        run: |
          echo "${{ secrets.GSHEET_SERVICE_ACCOUNT }}" | base64 --decode > gsheets.json

      # 7. Render the Quarto PDF.
      # Output is tee'd so the failure step below can read it. pipefail keeps
      # quarto's own exit code rather than tee's.
      - name: Render PDF
        run: |
          set -o pipefail
          quarto render quarterly_macro_debt_report_ieakenya.qmd --to pdf 2>&1 | tee render-output.log

      # 7b. On failure, print the logs AND re-emit the key lines as GitHub
      # ::error:: annotations. Annotations appear on the run summary page,
      # which is readable without expanding the job log - otherwise a failure
      # here shows only "Process completed with exit code 1" and the actual
      # cause is buried where it is awkward to get at.
      - name: Surface failure details
        if: failure()
        run: |
          emit() {
            sed -e 's/%/%25/g' | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::${l}"
            done
          }

          if [ -f render-output.log ]; then
            echo "========== render output (last 80 lines) =========="
            tail -80 render-output.log
            echo "========== re-emitting as annotations =========="
            grep -iE "error|^!|undefined|cannot|failed|not found" render-output.log \
              | tail -12 | emit
          else
            echo "no render-output.log - failure happened before the render step"
          fi

          for f in *.log; do
            [ -f "$f" ] || continue
            [ "$f" = "render-output.log" ] && continue
            echo "========== $f (last 80 lines) =========="
            tail -80 "$f"
            grep -iE "^!|error|undefined control|not found" "$f" | tail -8 | emit
          done

      # 8. Publish. The daily copy goes to the "report" branch, which always
      # holds ONE commit (force-pushed), so daily renders don't pile up a
      # 1 MB PDF per day in the repository's history. The website's card and
      # any shared link use:
      #   https://raw.githubusercontent.com/<repo>/report/quarterly_macro_debt_report_ieakenya.pdf
      - name: Publish today's report to the report branch
        run: |
          set -euo pipefail
          mv latest.json docs/latest.json
          mv quarterly_macro_debt_report_ieakenya.pdf docs/
          out="$(mktemp -d)"
          cp docs/quarterly_macro_debt_report_ieakenya.pdf docs/latest.json "$out/"
          [ -f docs/kenya_public_debt_data.xlsx ] && cp docs/kenya_public_debt_data.xlsx "$out/"
          cd "$out"
          git init -q -b report
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -q -m "Report as at $(TZ=Africa/Nairobi date '+%d %b %Y')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" report:report
          echo "Published: $(cat latest.json | tr -d '\n')" >> "$GITHUB_STEP_SUMMARY"

      # 9. Older links point at docs/ on main. Update that copy only when the
      # edition changes (a new quarter), i.e. about four commits a year.
      - name: Update docs/ on main when a new quarter's edition appears
        run: |
          set -euo pipefail
          new_q=$(python3 -c "import json;print(json.load(open('docs/latest.json'))['quarter'])")
          old_q=$(git show HEAD:docs/latest.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['quarter'])" 2>/dev/null || echo none)
          echo "Edition on main: $old_q; today's: $new_q"
          if [ "$new_q" = "$old_q" ]; then echo "Same edition: main left as is."; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/quarterly_macro_debt_report_ieakenya.pdf docs/kenya_public_debt_data.xlsx docs/latest.json
          git commit -m "New edition: $new_q"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
