name: Render Quarto PDF Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 21:00 UTC = 00:00 East Africa Time (UTC+3), every day.
    # GitHub Actions cron is always UTC, so this is written as the UTC
    # equivalent of local midnight.
    - cron: '0 21 * * *'

jobs:
  render-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # 2b. Cache R packages (MAJOR SPEED-UP)
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/R
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            r-${{ runner.os }}-

      # 3. Set up Quarto (PINNED, STABLE)
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.4.553"

      # 3b. Cache TinyTeX.
      # Quarto installs TinyTeX into the XDG data dir on Linux
      # (~/.local/share/TinyTeX), NOT ~/.TinyTeX. The original key cached a
      # path that never existed, so TinyTeX was silently reinstalled on every
      # single run. Both locations are listed so a hit works either way.
      # Bump -v3 to -v4 (etc.) to force a fresh TeX Live.
      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/.local/share/TinyTeX
          key: tinytex-${{ runner.os }}-v3

      # 3c. Install TinyTeX safely (skips if cached)
      - name: Install TinyTeX
        run: |
          quarto install tinytex

      # 3d. Make sure the LaTeX packages this report needs are present.
      # tlmgr is LOCATED rather than assumed -- hardcoding a bin path is what
      # broke run #56. This step can never fail the build: if tlmgr cannot be
      # found, TinyTeX's mid-render auto-install remains the fallback and the
      # render step reports the real error instead of this one masking it.
      - name: Install required LaTeX packages
        continue-on-error: true
        run: |
          set +e
          TLMGR="$(command -v tlmgr)"
          if [ -z "$TLMGR" ]; then
            for d in "$HOME"/.TinyTeX/bin/* "$HOME"/.local/share/TinyTeX/bin/*; do
              if [ -x "$d/tlmgr" ]; then TLMGR="$d/tlmgr"; break; fi
            done
          fi
          echo "tlmgr resolved to: ${TLMGR:-<not found>}"
          if [ -n "$TLMGR" ]; then
            "$TLMGR" update --self
            "$TLMGR" install \
              tabularx enumitem booktabs colortbl xcolor caption \
              titlesec multicol fancyhdr lastpage float setspace
          fi
          exit 0

      # 4. System dependencies (graphics, fonts, PDF)
      - name: Install system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libuv1-dev \
            libharfbuzz-dev \
            libfreetype6-dev \
            fonts-dejavu \
            fonts-liberation

      # 5. Install required R packages (cache-aware)
      - name: Install R packages
        run: |
          Rscript -e '
          pkgs <- c(
            "knitr","rmarkdown","dplyr","ggplot2","readr","tidyr",
            "purrr","stringr","forcats","googlesheets4","gargle",
            "jsonlite","xml2","systemfonts","ragg","svglite",
            "curl","httr2","ggthemes","openxlsx",
            # kableExtra/scales/tibble are loaded by the report but were
            # absent here: this list was written for the earlier placeholder
            # document, which did not use them. Their absence is what made
            # every render fail with "there is no package called kableExtra".
            "kableExtra","scales","tibble"
          )
          new <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(new)) install.packages(new, repos = "https://cloud.r-project.org")

          # Verify every package the .qmd loads is actually installed, and
          # stop here with a clear message if not. Without this the failure
          # surfaces 10 minutes later as an opaque library() error.
          src <- readLines("quarterly_macro_debt_report_ieakenya.qmd", warn = FALSE)
          used <- unique(c(
            gsub(".*library\\(([A-Za-z0-9._]+)\\).*", "\\1",
                 grep("library\\(", src, value = TRUE)),
            gsub(".*requireNamespace\\(\"([A-Za-z0-9._]+)\".*", "\\1",
                 grep("requireNamespace\\(", src, value = TRUE))
          ))
          used <- used[grepl("^[A-Za-z][A-Za-z0-9._]*$", used)]
          absent <- used[!used %in% rownames(installed.packages())]
          if (length(absent)) {
            stop("The report loads packages this workflow does not install: ",
                 paste(absent, collapse = ", "),
                 ". Add them to the pkgs vector above.")
          }
          cat("All", length(used), "packages required by the report are installed.\n")
          '

      # 6. Write Google Sheets service account to file
      - name: Write Google Sheets service account to file
        run: |
          echo "${{ secrets.GSHEET_SERVICE_ACCOUNT }}" | base64 --decode > gsheets.json

      # 7. Render the Quarto PDF.
      # Output is tee'd so the failure step below can read it. pipefail keeps
      # quarto's own exit code rather than tee's.
      - name: Render PDF
        run: |
          set -o pipefail
          quarto render quarterly_macro_debt_report_ieakenya.qmd --to pdf 2>&1 | tee render-output.log

      # 7b. On failure, print the logs AND re-emit the key lines as GitHub
      # ::error:: annotations. Annotations appear on the run summary page,
      # which is readable without expanding the job log - otherwise a failure
      # here shows only "Process completed with exit code 1" and the actual
      # cause is buried where it is awkward to get at.
      - name: Surface failure details
        if: failure()
        run: |
          emit() {
            sed -e 's/%/%25/g' | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::${l}"
            done
          }

          if [ -f render-output.log ]; then
            echo "========== render output (last 80 lines) =========="
            tail -80 render-output.log
            echo "========== re-emitting as annotations =========="
            grep -iE "error|^!|undefined|cannot|failed|not found" render-output.log \
              | tail -12 | emit
          else
            echo "no render-output.log - failure happened before the render step"
          fi

          for f in *.log; do
            [ -f "$f" ] || continue
            [ "$f" = "render-output.log" ] && continue
            echo "========== $f (last 80 lines) =========="
            tail -80 "$f"
            grep -iE "^!|error|undefined control|not found" "$f" | tail -8 | emit
          done

      # 8. Move output PDF to docs/
      - name: Move PDF to docs
        run: |
          mkdir -p docs
          mv quarterly_macro_debt_report_ieakenya.pdf docs/

      # 8.5 Stash local changes (required before rebase)
      - name: Stash changes
        run: |
          git stash --include-untracked

      # 8.6 Pull latest main to avoid CI push conflicts
      - name: Pull latest main
        run: |
          git pull --rebase origin main

      # 8.7 Restore stashed changes
      - name: Apply stashed changes
        run: |
          git stash pop || echo "Nothing to pop"

      # 9. Commit PDF (and the Figure 1 Excel data export) back to main
      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/quarterly_macro_debt_report_ieakenya.pdf docs/figure1_debt_trend_data.xlsx docs/figure2_debt_per_capita_data.xlsx docs/figure3_debt_to_gdp_data.xlsx
          git commit -m "Update latest quarterly debt report PDF and Figure 1 data export" || echo "No changes to commit"
          git push